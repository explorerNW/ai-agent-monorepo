name: Docker Local CI/CD Pipeline

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_DIR: ${{ github.workspace }}
  PROJECT_NAME: ai-agent-monorepo

jobs:
  build-and-deploy:
    environment: ci
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}
          submodules: false
        timeout-minutes: 5

      - name: Verify Checkout
        run: |
          if [ ! -f "package.json" ]; then
            echo "::error::Checkout failed - package.json not found"
            exit 1
          fi
          echo "Commit: $(git log -1 --format='%h - %s (%ar)')"

      # secrets 上下文不支持 secrets[变量名] 动态下标，
      # 缺失的 secret 会在后续真正用到它的 ssh-action 步骤自然报错，
      # 这里只做仓库根目录关键文件的检查。
      - name: Validate Configuration
        run: |
          for FILE in docker-compose.yml docker.sh; do
            if [ ! -f "$FILE" ]; then
              echo "::warning::$FILE not found at repo root"
            fi
          done
          echo "Configuration validated"

      # 部署到服务器
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script_stop: true
          debug: false
          envs: |
            DEPLOY_DOMAIN
            VITE_API_BASE_URL
          script: |
            set -e

            echo "Deployment started at $(date)"

            # 1. 预检查
            docker info > /dev/null 2>&1 || { echo "::error::Docker not running"; exit 1; }
            DISK_USAGE=$(df -h / | awk 'NR==2 {print $5}')
            echo "Disk: ${DISK_USAGE} used"

            # 2. 进入项目目录，拉取最新代码
            cd ${{ env.DEPLOY_DIR }} || { echo "::error::Directory not found"; exit 1; }
            git config user.email "ci-cd@bot" 2>/dev/null || true
            git config user.name "CI/CD" 2>/dev/null || true

            # 硬重置到远程分支，避免本地修改冲突
            git fetch origin ${{ github.ref_name }} --depth 1
            git reset --hard origin/${{ github.ref_name }}
            echo "Code synced: $(git log -1 --format='%h - %s (%ar)')"

            # 3. 生成环境变量文件（用 printf 避免 heredoc 缩进问题）
            mkdir -p packages/front-end packages/back-end

            printf '%s\n' "VITE_API_BASE_URL=${VITE_API_BASE_URL:-}" > packages/front-end/.env

            printf '%s\n' \
              "FRONT_END_URL=${{ secrets.FRONT_END_URL }}" \
              "FRONT_END_URL_DEV=${{ secrets.FRONT_END_URL_DEV }}" \
              "RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}" \
              "RABBITMQ_PASS=${{ secrets.RABBITMQ_PASS }}" \
              "RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }}" \
              "PORT=${{ secrets.PORT }}" \
              "DIFY_API_KEY=${{ secrets.DIFY_API_KEY }}" \
              "DIFY_BASE_URL=${{ secrets.DIFY_BASE_URL }}" \
              "DIFY_DATASET_ID=${{ secrets.DIFY_DATASET_ID }}" \
              "DIFY_DATASET_API_KEY=${{ secrets.DIFY_DATASET_API_KEY }}" \
              "GITHUB_TOKEN=${{ secrets.GIT_TOKEN }}" \
              "GITHUB_OWNER=${{ secrets.GIT_OWNER }}" \
              "DASHSCOPE_API_KEY=${{ secrets.DASHSCOPE_API_KEY }}" \
              "AI_MODEL_NAME=${{ secrets.AI_MODEL_NAME }}" \
              "DB_HOST=${{ secrets.DB_HOST }}" \
              "DB_PORT=${{ secrets.DB_PORT }}" \
              "DB_USER=${{ secrets.DB_USER }}" \
              "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
              "DB_NAME=${{ secrets.DB_NAME }}" \
              "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" \
              "REDIS_USER=${{ secrets.REDIS_USER }}" \
              "REDIS_PASS=${{ secrets.REDIS_PASS }}" \
              "REDIS_HOST=${{ secrets.REDIS_HOST }}" \
              "NPM_REGISTRY=${{ secrets.NPM_REGISTRY }}" \
              > packages/back-end/.env

            printf '%s\n' \
              "RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}" \
              "RABBITMQ_PASS=${{ secrets.RABBITMQ_PASS }}" \
              "RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }}" \
              "FRONT_END_URL=${{ secrets.FRONT_END_URL }}" \
              "FRONT_END_URL_DEV=${{ secrets.FRONT_END_URL_DEV }}" \
              "VITE_API_BASE_URL=${VITE_API_BASE_URL:-}" \
              "DEPLOY_DOMAIN=${{ secrets.DEPLOY_DOMAIN }}" \
              "DEPLOY_PORT=${{ secrets.DEPLOY_PORT }}" \
              "CLICKHOUSE_HOST=${{ secrets.CLICKHOUSE_HOST }}" \
              "CLICKHOUSE_USER=${{ secrets.CLICKHOUSE_USER }}" \
              "CLICKHOUSE_PASSWORD=${{ secrets.CLICKHOUSE_PASSWORD }}" \
              "CLICKHOUSE_DB=${{ secrets.CLICKHOUSE_DB }}" \
              "REDIS_USER=${{ secrets.REDIS_USER }}" \
              "REDIS_PASS=${{ secrets.REDIS_PASS }}" \
              "REDIS_HOST=${{ secrets.REDIS_HOST }}" \
              "NPM_REGISTRY=${{ secrets.NPM_REGISTRY }}" \
              > .env

            echo ".env files generated"

            # 4. 部署（复用 docker.sh deploy，智能变更检测 + 并行构建 + 安全切换 + 自动回滚）
            chmod +x docker.sh
            export DEPLOY_DOMAIN="${{ secrets.DEPLOY_DOMAIN }}"

            ./docker.sh deploy

            echo "Deployment completed at $(date)"

      # 部署后验证
      - name: Post-deployment Verification
        if: always()
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script_stop: false
          debug: false
          script: |
            cd ${{ env.DEPLOY_DIR }} || exit 1

            echo "Container status:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true

            FAILED=()
            for SVC in ai-agent-backend ai-agent-frontend ai-agent-rabbitmq-service; do
              if docker ps --filter "name=$SVC" --filter "status=running" --format '{{.Names}}' | grep -q .; then
                echo "$SVC: running"
              else
                echo "::error::$SVC: not running"
                FAILED+=("$SVC")
              fi
            done

            if [ ${#FAILED[@]} -gt 0 ]; then
              echo "Failed: ${FAILED[*]}"
              for SVC in "${FAILED[@]}"; do
                echo "--- $SVC logs ---"
                docker logs --tail 30 "$SVC" 2>&1 || true
              done
              exit 1
            fi

            echo "All services verified"

      - name: Deployment Summary
        if: always()
        run: |
          echo "=========================================="
          echo "Deployment Summary"
          echo "=========================================="
          echo "Status: ${{ job.status }}"
          echo "Time:   $(date '+%Y-%m-%d %H:%M:%S')"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor:  ${{ github.actor }}"
          echo "=========================================="
