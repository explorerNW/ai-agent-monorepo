<!-- 外层容器：设置为 Flex 垂直布局，且最小高度撑满整个视口 -->
<div class="flex flex-col min-h-screen">
  <!-- 顶部：固定高度 -->
  <header class="bg-gray-800 text-white p-4">
    <nav class="flex items-center gap-4">
      <a class="cursor-pointer" routerLink="/home">Home</a>
      <a class="cursor-pointer" routerLink="/activities">Activities</a>
    </nav>
  </header>

  <!-- 中间：核心自适应区域 -->
  <content class="flex-1 overflow-y-auto bg-gray-50 p-6">
    <!-- Angular 路由出口 -->
    <router-outlet />
  </content>

  <!-- 底部：固定高度 -->
  <footer class="bg-gray-800 text-white p-4">footer</footer>
</div>
