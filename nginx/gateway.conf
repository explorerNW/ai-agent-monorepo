# ─── Upstream ───
upstream backend_pool {
    server back-end:3000;
}

upstream frontend_pool {
    server front-end:80;
}

# ─── Rate Limiting ───
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=5r/s;

# ─── HTTP → HTTPS Redirect ───
server {
    listen 80;
    server_name localhost niewang.uunat.com;
    return 301 https://$host$request_uri;
}

# ─── HTTPS Server ───
server {
    listen 443 ssl http2;
    server_name localhost niewang.uunat.com;

    # SSL
    ssl_certificate     /run/secrets/ssl_cert;
    ssl_certificate_key /run/secrets/ssl_key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Request-ID $request_id always;

    # ─── API Routes ───
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://backend_pool/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ─── AI Streaming (SSE) ───
    location /ai/ {
        limit_req zone=ai_limit burst=10 nodelay;
        proxy_pass http://backend_pool/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    # ─── File Upload ───
    location /pdf/ {
        client_max_body_size 50M;
        proxy_pass http://backend_pool/pdf/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ─── RabbitMQ Management (optional — restrict to internal IPs in production) ───
    # location /mq/ {
    #     proxy_pass http://rabbitmq:15672/;
    #     proxy_set_header Host $host;
    # }

    # ─── Grafana (optional — restrict to internal IPs in production) ───
    # location /mon/ {
    #     proxy_pass http://grafana:3000/;
    #     proxy_set_header Host $host;
    # }

    # ─── Frontend Static ───
    location / {
        proxy_pass http://frontend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Health Check ───
    location /health {
        return 200 'healthy';
        add_header Content-Type text/plain;
    }
}
